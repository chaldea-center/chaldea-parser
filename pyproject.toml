[tool.poetry]
name = "chaldea-parser"
version = "1.1.0"
description = "Chaldea parser"
authors = ["narumi <narumi@chaldea.center>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
mwclient = "^0.10.1"
mwparserfromhell = "^0.6.4"
ratelimit = "^2.2.1"
requests = "^2.32.3"
requests-cache = "^0.9.3"
wikitextparser = "^0.48.0"
pydantic = "^2.7.3"
pydantic-settings = "^2.3.1"
orjson = "^3.10.3"
python-dotenv = "^1.0.0"
lxml = "^5.3"
discord-webhook = "^1.0.0"
msgpack = "^1.0.8"
pytz = "^2024.1"
gitpython = "^3.1.50"

[tool.poetry.group.dev.dependencies]
# Local dev: run scripts/use_local_api.sh to overlay the venv copy with the sibling checkout
# fgo-game-data-api = { git = "https://github.com/chaldea-center/fgo-game-data-api.git" }
fgo-game-data-api = { path =  "../fgo-game-data-api-c", develop = true }
iPython = "^8.0.1"
ipykernel = "^6.29.4"
pyperclip = "^1.8.2"
gspread = "^6.1.2"
ruff = "^0.14.13"
basedpyright = "^1.40"

[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=1.1.0"]
build-backend = "poetry.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["main_test.py", "test.py"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "BLE",
    "ARG",
    "B",
    "C4",
    "PT",
    "PIE",
    "PLC",
    "PLE",
    "PLR",
    "RUF",
    "I",
]
ignore = [
    "E501",
    "B008",
    "PT023",
    "PT006",
    "PLC1901",
    "PLR2004",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR5501",
    "RUF001",
    "RUF003",
    "RUF012",
]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.basedpyright]
typeCheckingMode = "standard"
reportDeprecated = "warning"
venvPath = "."
venv = ".venv"
# Notebook experiments and local test scripts are not part of the checked codebase
exclude = ["dev.ipynb", "tmp", "main_test.py", "test.py"]
